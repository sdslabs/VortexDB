[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vortexdb"
version = "0.1.5"
description = "Python client for VortexDB"
readme = "README.md"
requires-python = ">=3.10"

keywords = ["vector-database", "grpc", "embeddings", "search", "rust"]

license = {file = "LICENSE"}

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    'Intended Audience :: Developers',
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]

dependencies = [
    "grpcio>=1.81.1",
    "protobuf>=6.33.5,<7.0.0",
]

[project.optional-dependencies]
dev = [
    "grpcio-tools>=1.81.1,<2.0.0",
    "pytest>=7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["vortexdb"]

[project.urls]
Repository = "https://github.com/sdslabs/VortexDB"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
exclude = ["vortexdb/grpc"]
