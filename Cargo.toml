[workspace]
resolver = "2"
members = [
    "crates/defs",
    "crates/storage",
    "crates/index",
    "crates/server",
    "crates/http",
    "crates/tui",
    "crates/grpc",
    "crates/benchmark",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
axum = "0.8"
axum-test = "18.1.0"
bincode = "1.3.3"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5.54", features = ["derive"] }
color-eyre = "0.6.5"
crossterm = "0.27"
dotenv = "0.15.0"
dotenvy = "0.15"
prost = "0.14.1"
prost-types = "0.14.1"
rand = "0.9.2"
ratatui = "0.26"
reqwest = { version = "0.12", features = ["json", "blocking", "multipart"] }
rocksdb = "0.21.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.145"
snafu = "0.8.9"
tempfile = "3.23.0"
tokio = { version = "1.47.1", features = ["full"] }
tokio-stream = "0.1.17"
tonic = "0.14.2"
tonic-build = "0.14.2"
tonic-prost = "0.14.2"
tonic-prost-build = "0.14.2"
tracing = "0.1.41"
tracing-subscriber = "0.3.20"
uuid = { version = "1.18.1", features = ["v4", "serde"] }

## workspaces members
api = { path = "crates/api" }
defs = { path = "crates/defs" }
grpc = { path = "crates/grpc" }
http = { path = "crates/http" }
index = { path = "crates/index" }
server = { path = "crates/server" }
storage = { path = "crates/storage" }
tui = { path = "crates/tui" }
#benchmark = { path = "crates/benchmark"}
