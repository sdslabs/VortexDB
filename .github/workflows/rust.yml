name: Rust CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

env:
  CARGO_TERM_COLOR: always

jobs:
  build_and_test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          components: clippy, rustfmt
          override: true

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check Code Formatting
        run: cargo fmt --all -- --check

      - name: Install protoc for gRPC server
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler 

      - name: Run Clippy (Linter)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build Project
        run: cargo build --verbose

      - name: Run Tests
        run: cargo test --verbose

      - name: Upload Server binary
        uses: actions/upload-artifact@v4
        with:
          name: server-binary
          path: target/debug/server

  udeps:
    name: Unused Dependencies (cargo-udeps)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Rust (nightly for udeps)
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install protoc for gRPC server
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler 

      # Using binstall to maximise workflow speed
      - name: Install cargo-udeps
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-udeps

      - name: Run cargo-udeps
        run: cargo +nightly udeps --workspace --all-targets --all-features

  taplo:
    name: Taplo (TOML formatting)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Rust (stable for cargo install)
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install taplo
        run: cargo +stable install taplo-cli --version ^0.9 --locked --force

      - name: Check TOML formatting with taplo
        run: taplo format --check

  integration:
    name: Integration Test
    needs: build_and_test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download server binary
        uses: actions/download-artifact@v4
        with:
          name: server-binary
          path: target/debug

      # This is very IMP. Kept crashing without it
      # File permissions are not maintained during artifact upload (upload-artifact@v4)
      - name: Make binary executable
        run: chmod +x target/debug/server

      - name: Write keys file
        run: |
          cat > keys.json <<'EOF'
          {"keys":[{"name":"ci-admin","role":"readwrite","key":"my-secret-password"}]}
          EOF

      - name: Start Server
        env:
          VORTEXDB_KEYS_FILE: keys.json
          DIMENSION: "3"
          STORAGE_TYPE: inmemory
          INDEX_TYPE: flat
          GRPC_HOST: 0.0.0.0
          GRPC_PORT: "50051"
          DISABLE_HTTP: "true"
        run: |
          ./target/debug/server > server.log 2>&1 &
          echo $! > server.pid

      - name: Wait for server to be ready
        run: |
          for i in {1..30}; do
            if (echo > /dev/tcp/127.0.0.1/50051) 2>/dev/null; then
              echo "Server is up"
              exit 0
            fi
            sleep 1
          done
          echo "Server did not start in time"
          cat server.log
          exit 1

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Package and Dev Deps
        working-directory: client/python
        run: pip install -e ".[dev]"

      - name: Run example scripts
        working-directory: client/python
        run: pytest examples/all.py -v

      - name: Dump server logs on failure
        if: failure()
        run: cat server.log

      - name: Stop server
        if: always()
        run: kill $(cat server.pid) 2>/dev/null || true
