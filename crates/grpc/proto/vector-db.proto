syntax = "proto3";

package vectordb;

import "google/protobuf/empty.proto";

message UUID {
  string value = 1;
}

service VectorDB {
  //Insert a point with a dense and/or sparse vector and return its PointID
  rpc InsertPoint(PointInput) returns (PointID) {}

  //Delete a point by its PointID
  rpc DeletePoint(PointID) returns (google.protobuf.Empty) {}

  //Get a point with its vectors and payload by PointID
  rpc GetPoint(PointID) returns (Point) {}

  //Search for the nearest points to a dense or sparse query
  rpc Search(SearchRequest) returns (SearchResponse) {}

  rpc InsertPointsBatch(InsertPointsBatchRequest) returns (InsertPointsBatchResponse) {}
  rpc SearchBatch(SearchBatchRequest) returns (SearchBatchResponse) {}
}


message PointInput {
  PointID id = 1;
  DenseVector dense_vector = 2;
  SparseVector sparse_vector = 3;
  Payload payload = 4;
}


message DenseQuery {
  DenseVector vector = 1;
  Similarity similarity = 2;
  optional uint64 ef = 3;
}


message SearchRequest {
  uint64 limit = 1;
  oneof query {
    DenseQuery dense = 2;
    SparseVector sparse = 3;
  }
}


message SearchHit {
  PointID id = 1;
  float score = 2;
}


message SearchResponse {
  repeated SearchHit hits = 1;
}

message DenseVector {
  repeated float values = 1;
}

message SparseVector {
  repeated uint32 token_ids = 1;
  repeated float weights = 2;
}

message Point {
  PointID id = 1;
  Payload payload = 2;
  DenseVector dense_vector = 3;
  SparseVector sparse_vector = 4;
}

message PointID {
  UUID id = 1;
}

enum Similarity{
  Euclidean = 0;
  Manhattan = 1;
  Hamming = 2;
  Cosine = 3;
}

enum ContentType {
  Image = 0;
  Text = 1;
}

message Payload {
  ContentType content_type = 1;
  string content = 2;
}

message InsertPointsBatchRequest {
  repeated PointInput points = 1;
}

message InsertPointsBatchResponse {
  repeated PointID ids = 1;
}

message SearchBatchRequest {
  repeated SearchRequest queries = 1;
}

message SearchBatchResponse {
  repeated SearchResponse results = 1;
}
