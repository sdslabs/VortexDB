[package]
name = "grpc"
version = "0.1.0"
edition = "2024"

[dependencies]
prost = "0.14.1"
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread"] }
tonic = "0.14.2"
tonic-prost-build = "0.14.2"
  
api = { path = "../api" }
storage = { path = "../storage" }
index = { path = "../index" }
defs = { path = "../defs" }

tonic-prost = "0.14.2"
