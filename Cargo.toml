[workspace]
resolver = "2" # Use the modern feature resolver
members = [
    "crates/defs",
    "crates/storage",
    "crates/index",
    "crates/server",
    "crates/http_server",
    "crates/tui",
    "crates/grpc_server",
]

# You can define shared dependencies for all crates here
[workspace.dependencies]
tokio = { version = "1.37.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# thiserror = "1.0"
anyhow = "1.0"
# tracing = "0.1.41"
# Add any other dependencies that multiple crates will use
# For example, if you introduce Axum/Tonic later, they might go here.
# axum = { version = "0.7", features = ["macros"] }
# tonic = "0.11"
# prost = "0.12"
uuid = { version = "1.18.1", features = ["v4", "serde"] }

